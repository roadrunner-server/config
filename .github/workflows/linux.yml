name: config

on:
  push:
    branches:
      - master
      - stable
  pull_request:
    branches:
      - master
      - stable

jobs:
  config_test:
    name: Config plugin (Go ${{ matrix.go }}, OS ${{matrix.os}})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        go: [ stable ]
        os: [ "ubuntu-latest" ]
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7 # action page: <https://github.com/actions/setup-go>
        with:
          go-version: ${{ matrix.go }}

      - name: Check out code
        uses: actions/checkout@v7

      - name: Init Go modules Cache # Docs: <https://git.io/JfAKn#go---modules>
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Create folders
        run: |
          mkdir ./tests/coverage-ci

      - name: Install Go dependencies
        run: go mod download

      - name: Run config unit tests with coverage
        run: |
          go test -timeout 20m -v -race -cover -tags=debug -coverpkg=./... -coverprofile=./tests/coverage-ci/configu.out -covermode=atomic ./...

      - name: Run golang tests with coverage
        run: |
          cd tests
          go test -timeout 20m -v -race -cover -tags=debug -coverpkg=github.com/roadrunner-server/config/v6/... -coverprofile=./coverage-ci/config.out -covermode=atomic ./...

      - name: Transform coverage files
        run: |
          cd tests/coverage-ci
          echo 'mode: atomic' > summary.txt
          tail -q -n +2 *.out >> summary.txt
          awk '
            NR == 1 { print; next }
            /^github\.com\/roadrunner-server\/config\/v6\// {
              sub(/^github\.com\/roadrunner-server\/config\/v6\//, "", $0)
              print
            }
          ' summary.txt > summary.filtered.txt
          mv summary.filtered.txt summary.txt

      - name: upload to codecov
        uses: codecov/codecov-action@v7 # Docs: <https://github.com/codecov/codecov-action>
        with:
          files: ./tests/coverage-ci/summary.txt
          fail_ci_if_error: false
